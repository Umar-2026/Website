<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Digital Skills</title>
  <meta name="description" content="Prototype login page for the Digital Skills website." />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand brand-inline">Digital Skills</a>
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <p class="error-text" id="emailError" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <p class="error-text" id="passwordError" aria-live="polite"></p>
        </div>

        <div class="form-row checkbox-row">
          <label for="remember">
            <input id="remember" name="remember" type="checkbox" />
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
        <p id="loginStatus" class="status-message" aria-live="polite"></p>
      </form>

      <div class="auth-links">
        <p>Need an account? <a href="signup.html">Sign up</a></p>
        <p><a href="forgot-password.html">Forgot password?</a></p>
        <p><a href="index.html">Back to homepage</a></p>
      </div>
    </div>
  </div>
</body>
</html>
