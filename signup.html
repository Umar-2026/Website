<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a new Digital Skills account. This is a front-end prototype only." />
    <title>Sign Up - Digital Skills</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/auth.js" defer></script>
    <script src="js/signup.js" defer></script>
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="brand brand-inline">Digital Skills</a>
          <p class="eyebrow">Create account</p>
          <h1>Sign Up</h1>
        </div>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" required />
            <p class="error-text" id="fullNameError" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" name="email" type="email" autocomplete="email" required />
            <p class="error-text" id="signupEmailError" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" required />
            <p class="error-text" id="signupPasswordError" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
            <p class="error-text" id="confirmPasswordError" aria-live="polite"></p>
          </div>

          <div class="form-row checkbox-row">
            <label for="terms">
              <input id="terms" name="terms" type="checkbox" />
              <span>I accept the terms and conditions</span>
            </label>
          </div>
          <p class="error-text" id="termsError" aria-live="polite"></p>

          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
          <p id="signupStatus" class="status-message" aria-live="polite"></p>
        </form>

        <div class="auth-links">
          <p>Already have an account? <a href="login.html">Login</a></p>
          <p><a href="index.html">Back to homepage</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
