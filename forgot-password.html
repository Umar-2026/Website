<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your password. This is a front-end prototype only." />
    <title>Forgot Password - Digital Skills</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/auth.js" defer></script>
    <script src="js/forgot-password.js" defer></script>
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="brand brand-inline">Digital Skills</a>
          <p class="eyebrow">Account help</p>
          <h1>Forgot Password</h1>
        </div>

        <form id="forgotPasswordForm" novalidate>
          <div class="form-group">
            <label for="resetEmail">Email</label>
            <input id="resetEmail" name="email" type="email" autocomplete="email" required />
            <p class="error-text" id="resetEmailError" aria-live="polite"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
          <p id="resetStatus" class="status-message" aria-live="polite"></p>
        </form>

        <div class="auth-links">
          <p><a href="login.html">Back to Login</a></p>
          <p><a href="index.html">Back to homepage</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
